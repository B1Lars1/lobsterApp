# Publiserer appen (mappen app/) til GitHub Pages ved hver push til main som
# endrer appen. Kan også startes for hånd under «Actions» → «Publiser appen» → «Run workflow».
#
# Før publisering sjekkes koden (syntaks, JSON og testene i tests/),
# og fillisten og versjonen i app/sw.js oppdateres, så telefonen alltid henter den nye
# versjonen (se scripts/lag_service_worker.py).

name: Publiser appen

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/lag_service_worker.py"
      - ".github/workflows/publiser.yml"
  workflow_dispatch:

# Bare det som trengs for å publisere til Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Ikke publiser to ganger samtidig
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v7

      - name: Sett opp Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # En push publiseres rett til telefonene. Stopp her hvis noe er åpenbart galt.
      - name: Sjekk koden før publisering
        run: |
          # Syntaks i JavaScript. Modulene sjekkes som .mjs, så de leses som ES-moduler i alle
          # Node-versjoner. sw.js og tema.js er vanlige script.
          mkdir -p "$RUNNER_TEMP/sjekk"
          for fil in app/js/*.js; do
            if grep -qE '^(import|export) ' "$fil"; then
              cp "$fil" "$RUNNER_TEMP/sjekk/$(basename "$fil" .js).mjs"
              node --check "$RUNNER_TEMP/sjekk/$(basename "$fil" .js).mjs"
            else
              node --check "$fil"
            fi
          done
          node --check app/sw.js
          # Syntaks i Python-skriptene og testene
          python -m py_compile scripts/*.py tests/*.py
          # Gyldig JSON i kartdataene og manifestet
          python -c "import json, pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in [*pathlib.Path('app/data').iterdir(), pathlib.Path('app/manifest.webmanifest')]]"
          # Testene i tests/: fangstoversikten regner som fasiten, og justeringen av
          # hummerpotensialet (eldre Node trenger flagget for ES-moduler i .js)
          FLAGG=""
          node --experimental-detect-module -e "" 2>/dev/null && FLAGG="--experimental-detect-module"
          for test in tests/*.test.mjs; do node $FLAGG "$test"; done

      - name: Oppdater fillisten og versjonen i sw.js
        run: python scripts/lag_service_worker.py

      - name: Klargjør GitHub Pages
        uses: actions/configure-pages@v6

      - name: Pakk mappen app/
        uses: actions/upload-pages-artifact@v5
        with:
          path: app

  publiser:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publisering.outputs.page_url }}
    steps:
      - name: Publiser til GitHub Pages
        id: publisering
        uses: actions/deploy-pages@v5
