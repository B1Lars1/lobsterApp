<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 44">
  <!-- Svart bøyleteine sett fra langsiden: symbolet for en teine i sjøen (se .symbol.teine i app.css).
       Nummeret legges oppå, midt på. teine-opptatt.svg er samme teine i grått. -->
  <defs>
    <pattern id="nett" width="4.5" height="4.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0H4.5M0 0V4.5" fill="none" stroke="#000" stroke-width="0.8" stroke-opacity="0.8"/>
    </pattern>
  </defs>
  <!-- Hvit kant rundt, så teinen synes mot mørkt hav -->
  <g fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round">
    <path d="M5 39V14Q5 5 14 5H50Q59 5 59 14V39Z"/>
    <rect x="4" y="37.5" width="56" height="3.5" rx="1"/>
  </g>
  <!-- Nettet -->
  <path d="M5 39V14Q5 5 14 5H50Q59 5 59 14V39Z" fill="#3b4046"/>
  <path d="M5 39V14Q5 5 14 5H50Q59 5 59 14V39Z" fill="url(#nett)"/>
  <!-- Bøylene, omrisset og bunnrammen -->
  <path d="M23 5V38M41 5V38" stroke="#0b0b0b" stroke-width="2.4"/>
  <path d="M5 39V14Q5 5 14 5H50Q59 5 59 14V39Z" fill="none" stroke="#0b0b0b" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="4" y="37.5" width="56" height="3.5" rx="1" fill="#0b0b0b"/>
</svg>
